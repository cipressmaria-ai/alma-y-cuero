<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0908">
  <title>Gestión de pedidos · Alma y Cuero</title>
  <style>
    *{box-sizing:border-box}
    html{min-height:100%;background:#0a0908}
    body{min-height:100vh;min-height:100dvh;margin:0;padding:24px;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#392319 0,#15100d 46%,#080808 85%);color:#f5e9dc;font:16px/1.55 Arial,sans-serif}
    main{width:min(100%,480px);padding:clamp(24px,6vw,42px);text-align:center;border:1px solid #85563d;background:#17110edb;box-shadow:0 20px 70px #0009}
    .mark{width:88px;height:88px;margin:0 auto 22px;border:1px solid #b78058;border-radius:50%;display:grid;place-items:center;color:#d9a67f;font:italic 32px Georgia,serif;letter-spacing:-.13em;padding-right:6px}
    .eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#ca9a76}
    h1{margin:12px 0 14px;font:400 clamp(32px,8vw,46px) Georgia,serif}
    p{margin:0 0 25px;color:#cbb8aa}
    a{display:block;padding:15px 18px;background:#bb8058;color:#160e0a;font-weight:700;text-decoration:none;text-transform:uppercase;letter-spacing:.08em;border:1px solid #d09b74;min-height:50px}
    a:hover,a:focus-visible{background:#dba47e;outline:2px solid #f4d0a9;outline-offset:3px}
    small{display:block;margin-top:21px;color:#bca99a;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">AC</div>
    <div class="eyebrow">Alma y Cuero</div>
    <h1>Gestión de pedidos</h1>
    <p>Tocá el botón para abrir el panel conectado con los pedidos de la tienda.</p>
    <a href="https://alma-y-cuero.cipressmaria.chatgpt.site/gestor.html">Abrir gestor</a>
    <small>Necesitás conexión a Internet. Si aparece una pantalla de acceso, iniciá sesión con la cuenta que tiene permiso para este sitio.</small>
  </main>
</body>
</html>
